# The workspace root. It is not a package anyone depends on: it lists the two
# packages that are resolved together (one pubspec.lock and one .dart_tool/
# for both), so the sample app always runs against the SDK's source next to
# it, exactly as a host app would depend on a published version.
name: flagkit_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - packages/flagkit
  - sample_app

dev_dependencies:
  flutter_lints: ^6.0.0
