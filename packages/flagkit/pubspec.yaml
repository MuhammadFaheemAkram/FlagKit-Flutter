name: flagkit
description: >-
  A small feature flag SDK for Flutter apps: typed synchronous reads, an
  offline-first cache, remote refresh, percentage rollouts and targeting,
  with a fake backend.
version: 0.3.0
repository: https://github.com/MuhammadFaheemAkram/FlagKit-Flutter
issue_tracker: https://github.com/MuhammadFaheemAkram/FlagKit-Flutter/issues
topics: [feature-flags, remote-config, sdk, rollout, offline]

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

# A member of the workspace, resolved with the sample app (one lockfile at
# the root).
resolution: workspace

# Every dependency here becomes a dependency of every app that adds the SDK,
# so the list stays short, and each constraint is a caret on a major version
# (an app pins exact versions in its lockfile; a library must not).
dependencies:
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  meta: ^1.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  connectivity_plus_platform_interface: ^2.1.0
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
